<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Édito Performance Dashboard</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --bg: #0C0E14;
  --surface: #141721;
  --surface-2: #1C2030;
  --surface-3: #242840;
  --border: #262B3D;
  --border-light: #333852;
  --text: #E2E5EE;
  --text-muted: #7B82A0;
  --text-dim: #4E5470;
  --accent: #5B8DEF;
  --accent-glow: rgba(91,141,239,0.15);
  --green: #3DD68C;
  --green-bg: rgba(61,214,140,0.1);
  --red: #EF6461;
  --red-bg: rgba(239,100,97,0.1);
  --amber: #F5B731;
  --amber-bg: rgba(245,183,49,0.1);
  --radius: 10px;
  --radius-sm: 6px;
}

body {
  font-family: 'Inter', -apple-system, sans-serif;
  background: var(--bg);
  color: var(--text);
  line-height: 1.5;
  min-height: 100vh;
}

/* ── Top Bar ── */
.topbar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 16px 32px;
  border-bottom: 1px solid var(--border);
  position: sticky;
  top: 0;
  background: rgba(12,14,20,0.92);
  backdrop-filter: blur(12px);
  z-index: 100;
}

.topbar-left {
  display: flex;
  align-items: center;
  gap: 20px;
}

.logo {
  font-size: 15px;
  font-weight: 700;
  letter-spacing: -0.02em;
  color: var(--text);
}

.logo span {
  color: var(--accent);
}

.topbar-right {
  display: flex;
  align-items: center;
  gap: 12px;
}

select {
  appearance: none;
  background: var(--surface-2);
  border: 1px solid var(--border);
  color: var(--text);
  font-family: inherit;
  font-size: 13px;
  font-weight: 500;
  padding: 8px 32px 8px 12px;
  border-radius: var(--radius-sm);
  cursor: pointer;
  background-image: url("data:image/svg+xml,%3Csvg width='10' height='6' viewBox='0 0 10 6' fill='none' xmlns='http://www.w3.org/2000/svg'%3E%3Cpath d='M1 1L5 5L9 1' stroke='%237B82A0' stroke-width='1.5' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E");
  background-repeat: no-repeat;
  background-position: right 10px center;
  transition: border-color 0.2s;
}

select:hover { border-color: var(--accent); }
select:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 2px var(--accent-glow); }

.period-toggle {
  display: flex;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  overflow: hidden;
}

.period-btn {
  background: none;
  border: none;
  color: var(--text-muted);
  font-family: inherit;
  font-size: 13px;
  font-weight: 500;
  padding: 8px 16px;
  cursor: pointer;
  transition: all 0.2s;
}

.period-btn:hover { color: var(--text); }
.period-btn.active {
  background: var(--accent);
  color: #fff;
}

/* ── Main Layout ── */
.main {
  max-width: 1400px;
  margin: 0 auto;
  padding: 24px 32px 48px;
}

/* ── KPI Row ── */
.kpi-row {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 16px;
  margin-bottom: 24px;
}

.kpi-card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 20px;
}

.kpi-label {
  font-size: 12px;
  font-weight: 500;
  color: var(--text-muted);
  text-transform: uppercase;
  letter-spacing: 0.05em;
  margin-bottom: 8px;
}

.kpi-value {
  font-size: 28px;
  font-weight: 700;
  letter-spacing: -0.03em;
  font-variant-numeric: tabular-nums;
}

.kpi-change {
  font-size: 12px;
  font-weight: 600;
  margin-top: 6px;
  display: inline-flex;
  align-items: center;
  gap: 3px;
  padding: 2px 8px;
  border-radius: 4px;
}

.kpi-change.up { color: var(--green); background: var(--green-bg); }
.kpi-change.down { color: var(--red); background: var(--red-bg); }

/* ── Insights Panel ── */
.insights-card {
  background: var(--surface);
  border: 1px solid transparent;
  border-radius: var(--radius);
  padding: 24px;
  margin-bottom: 24px;
  position: relative;
  overflow: hidden;
}

.insights-card::before {
  content: '';
  position: absolute;
  inset: 0;
  border-radius: var(--radius);
  padding: 1px;
  background: linear-gradient(135deg, var(--accent), #a855f7, var(--accent));
  -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
  -webkit-mask-composite: xor;
  mask-composite: exclude;
  pointer-events: none;
}

.insights-header {
  display: flex;
  align-items: center;
  gap: 8px;
  margin-bottom: 16px;
}

.insights-badge {
  font-size: 11px;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.08em;
  color: var(--accent);
  background: var(--accent-glow);
  padding: 3px 10px;
  border-radius: 4px;
}

.insights-title {
  font-size: 14px;
  font-weight: 600;
  color: var(--text);
}

.insights-body {
  font-size: 14px;
  line-height: 1.7;
  color: var(--text-muted);
}

.insights-body strong {
  color: var(--text);
  font-weight: 600;
}

.insights-body .highlight-up {
  color: var(--green);
  font-weight: 600;
}

.insights-body .highlight-down {
  color: var(--red);
  font-weight: 600;
}

.insights-body .highlight-num {
  color: var(--amber);
  font-weight: 600;
}

/* ── Two-column layout ── */
.grid-2 {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 16px;
  margin-bottom: 24px;
}

/* ── Cards ── */
.card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  overflow: hidden;
}

.card-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 16px 20px;
  border-bottom: 1px solid var(--border);
}

.card-title {
  font-size: 14px;
  font-weight: 600;
}

.card-subtitle {
  font-size: 12px;
  color: var(--text-muted);
}

/* ── Tabs ── */
.tab-row {
  display: flex;
  gap: 0;
  border-bottom: 1px solid var(--border);
  margin-bottom: 24px;
}

.tab-btn {
  background: none;
  border: none;
  border-bottom: 2px solid transparent;
  color: var(--text-muted);
  font-family: inherit;
  font-size: 14px;
  font-weight: 500;
  padding: 12px 20px;
  cursor: pointer;
  transition: all 0.2s;
}

.tab-btn:hover { color: var(--text); }
.tab-btn.active {
  color: var(--text);
  border-bottom-color: var(--accent);
}

/* ── Tables ── */
table {
  width: 100%;
  border-collapse: collapse;
  font-variant-numeric: tabular-nums;
}

thead th {
  text-align: left;
  font-size: 11px;
  font-weight: 600;
  color: var(--text-muted);
  text-transform: uppercase;
  letter-spacing: 0.05em;
  padding: 10px 16px;
  border-bottom: 1px solid var(--border);
  white-space: nowrap;
}

thead th.right { text-align: right; }

tbody td {
  padding: 12px 16px;
  font-size: 13px;
  border-bottom: 1px solid var(--border);
}

tbody td.right {
  text-align: right;
  font-weight: 500;
}

tbody td.dim { color: var(--text-muted); }

tbody tr:last-child td { border-bottom: none; }

tbody tr:hover { background: var(--surface-2); }

/* ── Index Bar ── */
.index-cell {
  display: flex;
  align-items: center;
  gap: 10px;
}

.index-value {
  font-weight: 600;
  min-width: 36px;
  text-align: right;
  font-size: 13px;
}

.index-bar-wrap {
  flex: 1;
  height: 8px;
  background: var(--surface-3);
  border-radius: 4px;
  position: relative;
  overflow: hidden;
  min-width: 80px;
}

.index-bar-center {
  position: absolute;
  left: 50%;
  top: 0;
  width: 1px;
  height: 100%;
  background: var(--border-light);
}

.index-bar {
  position: absolute;
  top: 0;
  height: 100%;
  border-radius: 4px;
  transition: width 0.4s ease;
}

.index-bar.over {
  left: 50%;
  background: var(--green);
}

.index-bar.under {
  right: 50%;
  background: var(--red);
}

/* ── Distribution buckets ── */
.dist-bar-wrap {
  width: 100%;
  height: 6px;
  background: var(--surface-3);
  border-radius: 3px;
  overflow: hidden;
}

.dist-bar {
  height: 100%;
  border-radius: 3px;
  background: var(--accent);
  transition: width 0.4s ease;
}

/* ── Metric toggles inside cards ── */
.metric-toggle {
  display: flex;
  background: var(--surface-2);
  border-radius: 4px;
  overflow: hidden;
}

.metric-btn {
  background: none;
  border: none;
  color: var(--text-dim);
  font-family: inherit;
  font-size: 11px;
  font-weight: 600;
  padding: 5px 10px;
  cursor: pointer;
  transition: all 0.2s;
  text-transform: uppercase;
  letter-spacing: 0.04em;
}

.metric-btn:hover { color: var(--text-muted); }
.metric-btn.active { background: var(--surface-3); color: var(--text); }

/* ── Section Label ── */
.section-label {
  font-size: 12px;
  font-weight: 600;
  color: var(--text-dim);
  text-transform: uppercase;
  letter-spacing: 0.08em;
  margin-bottom: 16px;
}

/* ── Full-width card ── */
.full-card { margin-bottom: 24px; }

/* ── Top Articles ── */
.article-rank {
  font-size: 12px;
  font-weight: 700;
  color: var(--text-dim);
  min-width: 28px;
}

.article-title {
  font-weight: 500;
  max-width: 500px;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.article-topic {
  font-size: 11px;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.04em;
  padding: 2px 8px;
  border-radius: 3px;
  white-space: nowrap;
}

.topic-mercato { color: var(--amber); background: var(--amber-bg); }
.topic-match { color: var(--accent); background: var(--accent-glow); }
.topic-blessure { color: var(--red); background: var(--red-bg); }
.topic-tactique { color: #a78bfa; background: rgba(167,139,250,0.1); }
.topic-selection { color: var(--green); background: var(--green-bg); }
.topic-rumeur { color: #f472b6; background: rgba(244,114,182,0.1); }
.topic-interview { color: #67e8f9; background: rgba(103,232,249,0.1); }
.topic-analyse { color: #c4b5fd; background: rgba(196,181,253,0.1); }
.topic-resultat { color: #86efac; background: rgba(134,239,172,0.1); }
.topic-default { color: var(--text-muted); background: var(--surface-3); }

/* ── Status Badges ── */
.status-badge {
  font-size: 11px;
  font-weight: 600;
  padding: 3px 10px;
  border-radius: 4px;
  white-space: nowrap;
  letter-spacing: 0.01em;
}

.status-high-over { color: #059669; background: rgba(5,150,105,0.15); }
.status-over { color: var(--green); background: var(--green-bg); }
.status-slight-over { color: #6ee7b7; background: rgba(110,231,183,0.08); }
.status-stable { color: var(--text-muted); background: var(--surface-3); }
.status-slight-under { color: #fca5a5; background: rgba(252,165,165,0.08); }
.status-under { color: var(--red); background: var(--red-bg); }
.status-high-under { color: #dc2626; background: rgba(220,38,38,0.15); }

.ratio-cell {
  font-size: 12px;
  color: var(--text-muted);
  white-space: nowrap;
}

.ratio-cell .arrow { 
  margin: 0 3px;
  color: var(--text-dim);
}

/* ── Timestamp ── */
.timestamp {
  font-size: 12px;
  color: var(--text-dim);
  text-align: right;
  padding: 8px 0;
}

/* ── Responsive ── */
@media (max-width: 900px) {
  .topbar { padding: 12px 16px; flex-wrap: wrap; gap: 12px; }
  .main { padding: 16px; }
  .kpi-row { grid-template-columns: repeat(2, 1fr); }
  .grid-2 { grid-template-columns: 1fr; }
}
</style>
</head>

    </div>
    <div style="padding: 0 0 8px;">
      <table id="indexTable"></table>
    </div>
  </div>

  <div class="timestamp" id="timestamp"></div>
</div>

      ...row,
      articles: Math.round(row.articles * (5 + Math.random() * 3)),
      search_clicks: Math.round(row.search_clicks * (5 + Math.random() * 3)),
      discover_clicks: Math.round(row.discover_clicks * (5 + Math.random() * 3)),
      sessions: Math.round(row.sessions * (5 + Math.random() * 3))
    };
  });
}

for (const site of DATA.sites) {
  if (!DATA.index[site].last_week) {
    DATA.index[site].last_week = {};
    DATA.index[site].last_month = {};
    for (const dim of ['topic', 'club', 'competition']) {
      const base = DATA.index[site].yesterday[dim];
      DATA.index[site].last_week[dim] = base; // same structure, different KPIs
      DATA.index[site].last_month[dim] = base;
    }
  }
  // Insights placeholders for other periods
  if (!DATA.insights[site].last_week) {
    DATA.insights[site].last_week = DATA.insights[site].yesterday.replace('hier', 'cette semaine');
    DATA.insights[site].last_month = DATA.insights[site].yesterday.replace('hier', 'ce mois-ci');
  }
  // Top articles placeholders
  if (!DATA.topArticles[site].last_week) {
    DATA.topArticles[site].last_week = DATA.topArticles[site].yesterday;
    DATA.topArticles[site].last_month = DATA.topArticles[site].yesterday;
  }
}
DATA.insights.all.last_week = DATA.insights.all.yesterday.replace('hier', 'cette semaine');
DATA.insights.all.last_month = DATA.insights.all.yesterday.replace('hier', 'ce mois-ci');

// ══════════════════════════════════════════════
// STATE
// ══════════════════════════════════════════════
let state = {
  site: 'all',
  period: 'yesterday',
  dimension: 'topic',
  metric: 'search'
};

// ══════════════════════════════════════════════
// HELPERS
// ══════════════════════════════════════════════
function fmt(n) {
  if (n >= 1000000) return (n / 1000000).toFixed(1).replace('.0', '') + 'M';
  if (n >= 1000) return (n / 1000).toFixed(1).replace('.0', '') + 'k';
  return n.toString();
}

function pct(n) { return n.toFixed(1) + '%'; }

function change(current, previous) {
  if (!previous) return { value: 0, label: '—', cls: '' };
  const diff = ((current - previous) / previous) * 100;
  return {
    value: diff,
    label: (diff >= 0 ? '+' : '') + diff.toFixed(1) + '%',
    cls: diff >= 0 ? 'up' : 'down'
  };
}

function topicClass(topic) {
  const map = {
    'Mercato': 'mercato', 'Match': 'match', 'Blessure': 'blessure',
    'Tactique': 'tactique', 'Sélection': 'selection', 'Rumeur': 'rumeur',
    'Interview': 'interview', 'Analyse': 'analyse', 'Résultat': 'resultat',
    'Formation': 'default'
  };
  return 'topic-' + (map[topic] || 'default');
}

function getStatus(index) {
  if (index >= 1.8) return { label: 'Forte surperf.', cls: 'status-high-over' };
  if (index >= 1.35) return { label: 'Surperformance', cls: 'status-over' };
  if (index >= 1.12) return { label: 'Légère surperf.', cls: 'status-slight-over' };
  if (index >= 0.88) return { label: 'Stable', cls: 'status-stable' };
  if (index >= 0.65) return { label: 'Légère sous-perf.', cls: 'status-slight-under' };
  if (index >= 0.4)  return { label: 'Sous-performance', cls: 'status-under' };
  return { label: 'Forte sous-perf.', cls: 'status-high-under' };
}

// ══════════════════════════════════════════════
// AGGREGATION (for "all sites")
// ══════════════════════════════════════════════
function aggregateKpis(period) {
  const result = { articles: 0, sessions: 0, search_clicks: 0, discover_clicks: 0, prev_articles: 0, prev_sessions: 0, prev_search: 0, prev_discover: 0 };
  for (const site of DATA.sites) {
    const k = DATA.kpis[site][period];
    result.articles += k.articles;
    result.sessions += k.sessions;
    result.search_clicks += k.search_clicks;
    result.discover_clicks += k.discover_clicks;
    result.prev_articles += k.prev_articles;
    result.prev_sessions += k.prev_sessions;
    result.prev_search += k.prev_search;
    result.prev_discover += k.prev_discover;
  }
  return result;
}

function aggregateDist(period) {
  const buckets = {};
  for (const site of DATA.sites) {
    for (const row of DATA.distribution[site][period]) {
      if (!buckets[row.bucket]) buckets[row.bucket] = { bucket: row.bucket, articles: 0, sessions: 0 };
      buckets[row.bucket].articles += row.articles;
      buckets[row.bucket].sessions += row.sessions;
    }
  }
  const rows = Object.values(buckets);
  const totalArticles = rows.reduce((s, r) => s + r.articles, 0);
  const totalSessions = rows.reduce((s, r) => s + r.sessions, 0);
  return rows.map(r => ({
    ...r,
    pct_articles: (r.articles / totalArticles * 100),
    pct_sessions: (r.sessions / totalSessions * 100)
  }));
}

function aggregateIndex(period, dim) {
  const map = {};
  for (const site of DATA.sites) {
    const rows = DATA.index[site][period]?.[dim] || DATA.index[site].yesterday[dim];
    for (const row of rows) {
      if (!map[row.name]) map[row.name] = { name: row.name, articles: 0, search_clicks: 0, discover_clicks: 0, sessions: 0 };
      map[row.name].articles += row.articles;
      map[row.name].search_clicks += row.search_clicks;
      map[row.name].discover_clicks += row.discover_clicks;
      map[row.name].sessions += row.sessions;
    }
  }
  const rows = Object.values(map);
  const totals = rows.reduce((acc, r) => ({
    articles: acc.articles + r.articles,
    search_clicks: acc.search_clicks + r.search_clicks,
    discover_clicks: acc.discover_clicks + r.discover_clicks,
    sessions: acc.sessions + r.sessions
  }), { articles: 0, search_clicks: 0, discover_clicks: 0, sessions: 0 });

  return rows.map(r => ({
    name: r.name,
    articles: r.articles,
    share_content: r.articles / totals.articles * 100,
    search_clicks: r.search_clicks,
    share_search: r.search_clicks / totals.search_clicks * 100,
    discover_clicks: r.discover_clicks,
    share_discover: r.discover_clicks / totals.discover_clicks * 100,
    sessions: r.sessions,
    share_sessions: r.sessions / totals.sessions * 100
  }));
}

function aggregateTopArticles(period) {
  let all = [];
  for (const site of DATA.sites) {
    const articles = DATA.topArticles[site][period] || DATA.topArticles[site].yesterday;
    all = all.concat(articles.map(a => ({ ...a, site })));
  }
  return all.sort((a, b) => b.sessions - a.sessions).slice(0, 10);
}

// ══════════════════════════════════════════════
// RENDER FUNCTIONS
// ══════════════════════════════════════════════

function renderKPIs() {
  const { site, period } = state;
  const k = site === 'all' ? aggregateKpis(period) : DATA.kpis[site][period];

  const items = [
    { label: 'Articles', value: k.articles, prev: k.prev_articles },
    { label: 'Sessions', value: k.sessions, prev: k.prev_sessions },
    { label: 'Search Clicks', value: k.search_clicks, prev: k.prev_search },
    { label: 'Discover Clicks', value: k.discover_clicks, prev: k.prev_discover }
  ];

  document.getElementById('kpiRow').innerHTML = items.map(item => {
    const ch = change(item.value, item.prev);
    return `<div class="kpi-card">
      <div class="kpi-label">${item.label}</div>
      <div class="kpi-value">${fmt(item.value)}</div>
      <div class="kpi-change ${ch.cls}">${ch.cls === 'up' ? '↑' : '↓'} ${ch.label} vs période préc.</div>
    </div>`;
  }).join('');
}

function renderInsights() {
  const { site, period } = state;
  const key = site === 'all' ? 'all' : site;
  const text = DATA.insights[key]?.[period] || DATA.insights[key]?.yesterday || 'Insights non disponibles pour cette période.';

  document.getElementById('insightsCard').innerHTML = `
    <div class="insights-header">
      <span class="insights-badge">✦ AI Insights</span>
      <span class="insights-title">Analyse automatique</span>
    </div>
    <div class="insights-body">${text}</div>
  `;
}

function renderDistribution() {
  const { site, period } = state;
  const rows = site === 'all' ? aggregateDist(period) : DATA.distribution[site][period];

  document.getElementById('distTable').innerHTML = `
    <thead>
      <tr>
        <th>Sessions</th>
        <th class="right">Articles</th>
        <th class="right">% contenu</th>
        <th class="right">Sessions</th>
        <th class="right">% sessions</th>
        <th style="width:120px"></th>
      </tr>
    </thead>
    <tbody>
      ${rows.map(r => `<tr>
        <td style="font-weight:500">${r.bucket}</td>
        <td class="right">${r.articles}</td>
        <td class="right dim">${pct(r.pct_articles)}</td>
        <td class="right">${fmt(r.sessions)}</td>
        <td class="right" style="font-weight:600; color: ${r.pct_sessions > 30 ? 'var(--green)' : r.pct_sessions < 5 ? 'var(--red)' : 'var(--text)'}">${pct(r.pct_sessions)}</td>
        <td><div class="dist-bar-wrap"><div class="dist-bar" style="width:${r.pct_sessions}%"></div></div></td>
      </tr>`).join('')}
    </tbody>
  `;
}

function renderTopArticles() {
  const { site, period } = state;
  let articles;
  if (site === 'all') {
    articles = aggregateTopArticles(period);
  } else {
    articles = DATA.topArticles[site]?.[period] || DATA.topArticles[site]?.yesterday || [];
  }

  document.getElementById('topArticlesTable').innerHTML = `
    <thead>
      <tr>
        <th style="width:30px">#</th>
        <th>Article</th>
        <th>Sujet</th>
        <th class="right">Sessions</th>
      </tr>
    </thead>
    <tbody>
      ${articles.slice(0, 8).map((a, i) => `<tr>
        <td><span class="article-rank">${i + 1}</span></td>
        <td><span class="article-title">${a.title}</span></td>
        <td><span class="article-topic ${topicClass(a.topic)}">${a.topic}</span></td>
        <td class="right" style="font-weight:600">${fmt(a.sessions)}</td>
      </tr>`).join('')}
    </tbody>
  `;
}

function renderIndex() {
  const { site, period, dimension, metric } = state;
  let rows;
  if (site === 'all') {
    rows = aggregateIndex(period, dimension);
  } else {
    rows = DATA.index[site][period]?.[dimension] || DATA.index[site].yesterday[dimension] || [];
  }

  // Compute shares and index based on selected metric
  const metricMap = {
    search: { shareKey: 'share_search', clicksKey: 'search_clicks', label: 'Search Clicks' },
    discover: { shareKey: 'share_discover', clicksKey: 'discover_clicks', label: 'Discover Clicks' },
    sessions: { shareKey: 'share_sessions', clicksKey: 'sessions', label: 'Sessions' }
  };
  const m = metricMap[metric];

  // Recalculate shares for aggregated data
  const totalContent = rows.reduce((s, r) => s + r.articles, 0);
  const totalMetric = rows.reduce((s, r) => s + r[m.clicksKey], 0);

  const enriched = rows.map(r => {
    const shareContent = r.articles / totalContent * 100;
    const shareMetric = totalMetric > 0 ? r[m.clicksKey] / totalMetric * 100 : 0;
    const index = shareContent > 0 ? shareMetric / shareContent : 0;
    return { ...r, shareContent, shareMetric, index };
  }).sort((a, b) => b.index - a.index);

  const maxIndex = Math.max(...enriched.map(r => r.index), 2);

  document.getElementById('indexTable').innerHTML = `
    <thead>
      <tr>
        <th style="min-width:120px">${dimension === 'topic' ? 'Sujet' : dimension === 'club' ? 'Club' : 'Compétition'}</th>
        <th class="right">Articles</th>
        <th class="right">% contenu</th>
        <th class="right">${m.label}</th>
        <th class="right">% trafic</th>
        <th class="right">Ratio</th>
        <th style="min-width:160px">Index</th>
        <th>Statut</th>
      </tr>
    </thead>
    <tbody>
      ${enriched.map(r => {
        const barWidth = Math.min(Math.abs(r.index - 1) / (maxIndex - 1) * 50, 48);
        const isOver = r.index >= 1;
        const status = getStatus(r.index);
        return `<tr>
          <td style="font-weight:500">${r.name}</td>
          <td class="right">${r.articles}</td>
          <td class="right dim">${pct(r.shareContent)}</td>
          <td class="right">${fmt(r[m.clicksKey])}</td>
          <td class="right">${pct(r.shareMetric)}</td>
          <td class="right"><span class="ratio-cell">${pct(r.shareContent)}<span class="arrow">→</span>${pct(r.shareMetric)}</span></td>
          <td>
            <div class="index-cell">
              <span class="index-value" style="color: ${isOver ? 'var(--green)' : 'var(--red)'}">${r.index.toFixed(2)}</span>
              <div class="index-bar-wrap">
                <div class="index-bar-center"></div>
                <div class="index-bar ${isOver ? 'over' : 'under'}" style="width: ${barWidth}%"></div>
              </div>
            </div>
          </td>
          <td><span class="status-badge ${status.cls}">${status.label}</span></td>
        </tr>`;
      }).join('')}
    </tbody>
  `;
}

function renderTimestamp() {
  const d = new Date(DATA.last_updated);
  document.getElementById('timestamp').textContent = `Dernière mise à jour : ${d.toLocaleDateString('fr-FR', { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' })} à ${d.toLocaleTimeString('fr-FR', { hour: '2-digit', minute: '2-digit' })}`;
}

function renderAll() {
  renderKPIs();
  renderInsights();
  renderDistribution();
  renderTopArticles();
  renderIndex();
  renderTimestamp();
}

// ══════════════════════════════════════════════
// EVENT HANDLERS
// ══════════════════════════════════════════════

// Populate site selector
const siteSelect = document.getElementById('siteSelect');
DATA.sites.forEach(s => {
  const opt = document.createElement('option');
  opt.value = s;
  opt.textContent = s;
  siteSelect.appendChild(opt);
});

siteSelect.addEventListener('change', e => {
  state.site = e.target.value;
  renderAll();
});

// Period toggle
document.querySelectorAll('.period-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.period-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    state.period = btn.dataset.period;
    renderAll();
  });
});

// Dimension tabs
document.querySelectorAll('.tab-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    state.dimension = btn.dataset.dim;
    renderIndex();
  });
});

// Metric toggle
document.querySelectorAll('.metric-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.metric-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    state.metric = btn.dataset.metric;
    renderIndex();
  });
});

// ══════════════════════════════════════════════
// INIT
// ══════════════════════════════════════════════
renderAll();
</script>
</body>
</html>
